name: Transfer theorem certificates
on:
  push:
    paths:
      - 'research/**'
      - 'website/transfer-theorem-lab/**'
      - 'publication/transfer-theorem-v1/**'
      - '.github/workflows/transfer-theorem.yml'
  pull_request:
    paths:
      - 'research/**'
      - 'website/transfer-theorem-lab/**'
      - 'publication/transfer-theorem-v1/**'
      - '.github/workflows/transfer-theorem.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r research/structured_transfer_2026_09/requirements.txt
      - run: python research/combined_transfer_2026_09/integrity.py
      - run: python research/combined_transfer_2026_09/framework/test_transfer.py
      - run: python -m unittest discover -s research/combined_transfer_2026_09/spatial -p test_spatial.py
      - run: python -m unittest discover -s research/combined_transfer_2026_09/blocks -p test_orbit.py
      - run: python -m unittest discover -s research/combined_transfer_2026_09/degree11 -p test_degree11.py
      - run: node --test website/transfer-theorem-lab/test-core.js
      - run: python publication/transfer-theorem-v1/verify_publication.py
