name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -c reproducibility-constraints.txt
      - run: python -m unittest discover -v

  browser-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node --test website/double-pendulum-oig-wind-tunnel/test-wind-tunnel-core.js
      - run: node --test website/double-pendulum-oig-wind-tunnel/test-wind-tunnel-ensemble-adversarial.js
      - run: node --test website/global-geometry-lab/test-global-geometry-core.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-core.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-ensembles.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-atlas.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-inverse.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-sheet.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-artifacts.js
      - run: node artifacts/global-geometry-ii/fabrication/validate-fabrication.js
      # Release v1 is a frozen historical snapshot; release-v2 tests verify that
      # it is retained but never promoted as certification of the evolved source.
      - run: node website/global-geometry-lab/test-global-geometry-ii-physical-preflight.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-u2-evaluation-index-v2.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-release-v2.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-static-publication-v2.js
      # CI maintenance commits are intentionally outside the immutable release-v2
      # source boundary. Verify that sealed snapshot rather than weakening its
      # source-drift checks at the current workflow commit.
      - uses: actions/checkout@v7
        with:
          ref: 67f82de0a0b4152a102d984b096e6e3549376dd8
          path: .release-v2-snapshot
          persist-credentials: false
      - working-directory: .release-v2-snapshot
        run: node website/global-geometry-lab/reproduce-global-geometry-ii-v2.js --verify --mode quick
