name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -c reproducibility-constraints.txt
      - run: python -m unittest discover -v

  browser-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test website/double-pendulum-oig-wind-tunnel/test-wind-tunnel-core.js
      - run: node --test website/double-pendulum-oig-wind-tunnel/test-wind-tunnel-ensemble-adversarial.js
      - run: node --test website/global-geometry-lab/test-global-geometry-core.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-core.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-ensembles.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-atlas.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-inverse.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-sheet.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-artifacts.js
      - run: node artifacts/global-geometry-ii/fabrication/validate-fabrication.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-reproduction.js
      - run: node website/global-geometry-lab/test-global-geometry-ii-certificates.js
      - run: node website/global-geometry-lab/reproduce-global-geometry-ii.js --verify
